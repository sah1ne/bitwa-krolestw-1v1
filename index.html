<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Bitwa Królestw 1v1</title>
    <style>
        body { background:#1b1b1b; color:#f0f0f0; font-family:Arial; }
        h1 { text-align:center; }
        #game {
            width: 900px;
            height: 500px;
            background: #333;
            margin: 20px auto;
            position: relative;
            border: 2px solid #777;
        }
        .tower {
            width: 40px;
            height: 40px;
            background: gold;
            border: 2px solid #aa8800;
            position: absolute;
        }
        .unit {
            width: 20px;
            height: 20px;
            background: crimson;
            border-radius: 50%;
            position: absolute;
        }
        #ui {
            text-align:center;
            margin-top:10px;
        }
        button {
            padding:8px 14px;
            margin:4px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <h1>Bitwa Królestw — 1 vs 1</h1>

    <div id="game"></div>

    <div id="ui">
        <p>Gracz 1 (lewa strona) vs Gracz 2 (prawa strona)</p>
        <button onclick="buildTower(1)">Postaw wieżę (Gracz 1)</button>
        <button onclick="buildTower(2)">Postaw wieżę (Gracz 2)</button>
        <button onclick="spawnUnit(1)">Wyślij jednostkę (Gracz 1)</button>
        <button onclick="spawnUnit(2)">Wyślij jednostkę (Gracz 2)</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
